[project]
name = "devcrew_backend"
version = "0.1.0"
description = "devcrew-backend using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.39,<2.0.0"
]

[project.scripts]
kickoff = "devcrew_backend.main:kickoff"
run_crew = "devcrew_backend.main:kickoff"
plot = "devcrew_backend.main:plot"
run_with_trigger = "devcrew_backend.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "f4bdb12f-a97d-4383-ae19-27cc49e722e1"
