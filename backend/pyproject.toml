[project]
name = "devcrew_backend"
version = "0.2.0"
description = "CrewAI Flow backend for the DevCrew software team"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai==1.15.39", "python-dotenv>=1,<2", "pyyaml>=6,<7", "mcp==1.30.0", "httpx>=0.27,<1", "websocket-client>=1.8,<2", "starlette>=0.47,<2", "uvicorn>=0.30,<1"]

[project.scripts]
kickoff = "devcrew_backend.main:kickoff"
run_crew = "devcrew_backend.main:kickoff"
plot = "devcrew_backend.main:plot"
run_with_trigger = "devcrew_backend.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "f4bdb12f-a97d-4383-ae19-27cc49e722e1"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
