[project]
name = "devcrew_frontend"
version = "0.2.0"
description = "Streamlit API client for DevCrew"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.41,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
